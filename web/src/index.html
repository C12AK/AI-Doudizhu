<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>斗地主</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="toast" hidden></div>

  <section id="view-login" class="view">
    <form id="form-login">
      <h1>斗地主</h1>
      <label>账号<input id="username" autocomplete="username" value="" /></label>
      <label>密码<input id="password" type="password" autocomplete="current-password" value="" /></label>
      <div class="login-actions">
        <button type="submit">登录</button>
        <button id="btn-register" type="button">注册</button>
      </div>
    </form>
  </section>

  <section id="view-hall" class="view" hidden>
    <header class="topbar">
      <div id="hall-user"></div>
      <div class="topbar-right">
        <button id="btn-create-room" type="button">创建房间</button>
        <button id="btn-logout" type="button" class="ghost">退出登录</button>
      </div>
    </header>
    <form id="form-search" class="hall-search">
      <input id="room-search" maxlength="60" autocomplete="off" placeholder="搜索房间名或房间号" />
      <button type="submit">搜索</button>
    </form>
    <div id="room-list" class="room-list"></div>
  </section>

  <section id="view-create" class="view" hidden>
    <header class="topbar">
      <button id="btn-create-back" type="button" class="ghost">返回</button>
    </header>
    <form id="form-create">
      <h1>创建房间</h1>
      <label>房间名<input id="room-name" maxlength="60" autocomplete="off" placeholder="请输入不超过60字符（一个汉字算2字符）" /></label>
      <label>局数<input id="match-count" type="number" min="1" max="99" value="8" /></label>
      <button type="submit">确认创建</button>
    </form>
  </section>

  <section id="view-game" class="view" hidden>
    <header class="topbar">
      <div id="meta"></div>
      <div class="topbar-right">
        <div id="mult"></div>
        <button id="btn-leave" type="button" class="ghost">离开</button>
      </div>
    </header>
    <div id="seats" class="seats"></div>
    <div class="pile">
      <div class="pile-label" id="bottom-label">底牌</div>
      <div id="bottom-cards" class="card-row spread"></div>
    </div>
    <div class="pile">
      <div class="pile-label" id="last-label"></div>
      <div id="last-cards" class="card-row overlap compact"></div>
    </div>
    <div id="hand" class="card-row overlap hand"></div>
    <div id="actions" class="actions"></div>
  </section>

  <div id="spring-flash" class="modal" hidden>
    <div class="panel spring-panel">
      <div id="spring-text"></div>
    </div>
  </div>

  <div id="settle" class="modal" hidden>
    <div class="panel">
      <h2 id="settle-title"></h2>
      <p id="settle-detail"></p>
      <button id="btn-settle-ready" type="button">准备</button>
      <button id="btn-leave-settle" type="button" class="ghost">离开</button>
    </div>
  </div>

  <div id="set-board" class="modal" hidden>
    <div class="panel">
      <h2>得分榜</h2>
      <div id="board-list"></div>
      <button id="btn-close-board" type="button">关闭得分榜</button>
      <button id="btn-leave-board" type="button" class="ghost">离开</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
