# 进程启动时读取。构建时拷进 deploy/config/config.ini，镜像里即 /app/config/config.ini。
# www_root、log_file 相对本文件所在目录。
# log_file 为服务端日志；同目录还会写 ddz-player.log、ddz-ai.log。

[SYS]
listen_addr=0.0.0.0
http_port=8080
www_root=../www
base_score=1

[LOG]
log_level=2
log_file=../log/ddz-server.log
log_file_size_mb=50
log_max_files=5

[MYSQL]
# host 必须是 db，与 docker-compose 里的服务名一致
host=db
port=3306
user=root
password=123456
database=ddz

[NET]
heartbeat_interval_sec=5
heartbeat_timeout_sec=10
retry_max=3
retry_timeout_sec=10

[DEEPSEEK]
url=https://api.deepseek.com/v1/chat/completions
# 选择模型
model=deepseek-v4-flash
# 填入你自己的 API Key
apikey=
