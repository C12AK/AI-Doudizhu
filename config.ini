# 进程启动时读取。Docker 构建时拷进镜像 /app/config/sysparam.ini。

[SYS]
listen_addr=0.0.0.0
http_port=8080
www_root=/app/www
base_score=1

[LOG]
log_level=2
log_file=/app/log/ddz-server.log
log_file_size_mb=50
log_max_files=5

[MYSQL]
# host 必须是 db，与 docker-compose 里的服务名一致
host=db
port=3306
user=root
password=123456
database=ddz

[NET]
heartbeat_interval_sec=5
heartbeat_timeout_sec=10
retry_max=3
retry_timeout_sec=10
